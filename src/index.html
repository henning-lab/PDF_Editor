<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; font-src 'self' data:; connect-src 'self' blob: data: https:; frame-src 'self' blob: about:; object-src 'none'; base-uri 'self'">
  <meta name="description" content="PDF Editor: PDFs zusammenfügen, trennen, komprimieren, umwandeln, bearbeiten und digital signieren. Kostenlos, direkt im Browser, ohne Upload.">
  <meta name="theme-color" content="#2563eb">
  <meta name="referrer" content="no-referrer">
  <title>PDF Editor</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=%V%">
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/fontkit.umd.min.js"></script>
  <script src="vendor/diff.min.js"></script>
  <script type="module" src="%APP%"></script>
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" title="Alle Werkzeuge">
      <span class="brand-mark">
        <svg viewBox="0 0 32 32" width="26" height="26"><rect x="3" y="2" width="22" height="28" rx="4" fill="currentColor" opacity=".18"/><path d="M8 2h11l8 8v18a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3z" fill="currentColor"/><path d="M19 2v6a2 2 0 0 0 2 2h6" fill="#fff" opacity=".55"/><path d="M10 21.5l7.5-7.5 2.5 2.5-7.5 7.5H10z" fill="#fff"/></svg>
      </span>
      <span class="brand-name">PDF Editor</span>
    </button>
    <div class="topbar-spacer"></div>
    <label class="search">
      <span class="search-icon" id="searchIcon"></span>
      <input id="search" type="search" placeholder="Werkzeug suchen …" autocomplete="off" spellcheck="false">
    </label>
  </header>
  <main id="view"></main>
  <div id="overlay" class="overlay hidden">
    <div class="overlay-card">
      <div class="spinner"></div>
      <div class="overlay-text" id="overlayText">Wird verarbeitet …</div>
      <div class="progress"><div class="progress-bar" id="overlayBar"></div></div>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>
</body>
</html>
